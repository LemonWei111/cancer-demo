<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病理诊断助手</title>
    <!-- Tailwind CSS - 使用unpkg.com (国内访问较好) -->
    <script src="https://unpkg.com/tailwindcss@3.4.0/lib/index.js"></script>
    <script>tailwind.config = { corePlugins: { preflight: false } }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios@1.6.0/dist/axios.min.js"></script>
    <script src="https://unpkg.com/marked@9.1.0/marked.min.js"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container {
            max-height: 60vh;
            overflow-y: auto;
        }

        .message {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .protocol-log-entry {
            transition: all 0.3s ease;
        }

        .protocol-log-entry:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #protocol-log-container {
            scrollbar-width: thin;
            scrollbar-color: #e5e7eb #f9fafb;
        }

        #protocol-log-container::-webkit-scrollbar {
            width: 6px;
        }

        #protocol-log-container::-webkit-scrollbar-track {
            background: #f9fafb;
            border-radius: 3px;
        }

        #protocol-log-container::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 3px;
        }

        #protocol-log-container::-webkit-scrollbar-thumb:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-6xl mx-auto">
            <!-- 头部 -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">
                    <i class="fas fa-vials text-blue-600"></i> 基于智能体互联网的病理诊断助手
                </h1>
                <p class="text-gray-600">多智能体协作病理切片分析</p>
                <div id="connection-status" class="mt-2 mx-auto inline-block" style="display: none;"></div>
            </div>

            <div class="max-w-4xl mx-auto">
                <!-- 对话区域 -->
                <div>
                    <div class="bg-white rounded-lg shadow-md">
                        <!-- 对话历史 -->
                        <div class="chat-container p-6 border-b border-gray-200">
                            <div id="chat-messages" class="space-y-4">
                                <div class="message bg-blue-50 border border-blue-200 rounded-lg p-4">
                                    <div class="flex items-center mb-2">
                                        <i class="fas fa-robot text-blue-600 mr-2"></i>
                                        <span class="font-medium text-blue-800">基于智能体互联网的病理诊断助手</span>
                                    </div>
                                    <p class="text-gray-700">
                                        您好！我是基于智能体互联网的病理诊断助手。请描述您的分析需求并上传切片图片，例如："帮我分析这张乳腺切片"。我会协调多智能体进行图像与临床语义联合分析，返回可读的结论与建议。点击“新会话”可开始新的分析流程。
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- 图片上传与输入区域 -->
                        <div class="p-6">
                            <!-- 图片上传区 -->
                            <div class="mb-4">
                                <div class="text-sm text-gray-700 mb-2">上传或拖拽病理切片图片（支持粘贴截图）</div>
                                <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg p-4 flex items-center justify-between bg-gray-50">
                                    <div class="flex items-center space-x-3">
                                        <i class="fas fa-image text-gray-500"></i>
                                        <span class="text-gray-600 text-sm">将图片拖拽到此处，或</span>
                                        <label for="image-input" class="px-3 py-1 bg-white border border-gray-300 rounded cursor-pointer hover:bg-gray-100 text-sm">选择图片</label>
                                        <input id="image-input" type="file" accept="image/*" class="hidden" />
                                    </div>
                                    <button id="clear-image" class="hidden text-sm text-gray-600 hover:text-gray-800">
                                        <i class="fas fa-times mr-1"></i>移除图片
                                    </button>
                                </div>
                                <div id="image-preview" class="mt-3 hidden">
                                    <div class="flex items-center space-x-3">
                                        <img id="preview-img" src="" alt="preview" class="h-24 w-24 object-cover rounded border" />
                                        <div class="text-sm text-gray-600" id="preview-meta"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex space-x-4">
                                <div class="flex-1">
                                    <textarea id="user-input" placeholder="请输入您的分析指令，例如：帮我分析这张乳腺切片..."
                                        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                                        rows="3"></textarea>
                                </div>
                                <div class="flex flex-col space-y-2">
                                    <button id="send-button"
                                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                                        <i class="fas fa-paper-plane mr-2"></i>发送
                                    </button>
                                    <button id="new-session-button"
                                        class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 transition-colors">
                                        <i class="fas fa-plus mr-2"></i>新会话
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 交互日志 -->
                    <div class="bg-white rounded-lg shadow-md mt-6">
                        <div class="p-4 border-b border-gray-200">
                            <div class="flex items-center justify-between">
                                <h2 class="text-lg font-semibold">
                                    <i class="fas fa-exchange-alt text-purple-600"></i> 交互日志
                                </h2>
                                <div class="flex space-x-2">
                                    <button id="clear-protocol-log"
                                        class="px-3 py-1 text-sm bg-gray-600 text-white rounded hover:bg-gray-700 transition-colors">
                                        <i class="fas fa-trash mr-1"></i>清空日志
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div id="protocol-log-container" class="p-4 max-h-96 overflow-y-auto">
                            <div id="protocol-log" class="space-y-3">
                                <div class="text-gray-500 text-center py-4">
                                    <i class="fas fa-info-circle mr-2"></i>
                                    暂无交互记录
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260713c"></script>
</body>

</html>
